name: 🚀 Supabase Preview Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Create or Update Supabase Preview (DB + Edge Functions)

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG: "Wanky Technologies Ltd"
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🏗️ Create or update Supabase preview branch
        id: preview
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          PREVIEW_NAME="preview-${BRANCH_NAME}"
          echo "Deploying Supabase preview: ${PREVIEW_NAME}"

          # Try to create or update preview branch
          supabase db branch create "${PREVIEW_NAME}" \
            --project-ref $SUPABASE_PROJECT_REF \
            --org "$SUPABASE_ORG" \
            --no-confirm || \
          supabase db branch push "${PREVIEW_NAME}" \
            --project-ref $SUPABASE_PROJECT_REF \
            --org "$SUPABASE_ORG"

          # Output preview info
          PREVIEW_URL="https://supabase.com/dashboard/project/${SUPABASE_PROJECT_REF}/branches/${PREVIEW_NAME}"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy Edge Functions to Preview Branch
        working-directory: packages/backend/functions
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          PREVIEW_NAME="preview-${BRANCH_NAME}"
          echo "Deploying Edge Functions to ${PREVIEW_NAME}..."
          supabase functions deploy --project-ref $SUPABASE_PROJECT_REF --branch "${PREVIEW_NAME}"

          echo "functions_preview_url=https://${PREVIEW_NAME}.functions.supabase.co" >> $GITHUB_OUTPUT

      - name: 💬 Post or update PR comment with preview links
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Supabase Preview Deployment
          message: |
            🚀 **Supabase Preview Environment Created**

            - **Branch:** `${{ github.head_ref || github.ref_name }}`
            - 🗄️ [Database Preview](${{ steps.preview.outputs.preview_url }})
            - ⚡ [Edge Functions Preview](${{ steps.preview.outputs.functions_preview_url }})
            
            All changes in this branch are live and isolated in your preview environment.

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: 🧹 Cleanup Supabase Preview Environment
    continue-on-error: true

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG: "Wanky Technologies Ltd"
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ⚙️ Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🧹 Delete Supabase preview branch (non-blocking)
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          PREVIEW_NAME="preview-${BRANCH_NAME}"
          echo "Attempting to delete Supabase preview: ${PREVIEW_NAME}"
          supabase db branch delete "${PREVIEW_NAME}" \
            --project-ref $SUPABASE_PROJECT_REF \
            --org "$SUPABASE_ORG" \
            --no-confirm || echo "No preview branch found. Skipping cleanup."

      - name: 💬 Remove PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Supabase Preview Deployment
          delete: true
