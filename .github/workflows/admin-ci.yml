name: Admin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Build
        working-directory: packages/admin
        run: |
          pnpm lint
          pnpm build
