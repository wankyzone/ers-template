name: Code Quality Check
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: Install deps
        run: pnpm install
      - name: Lint + Build + TypeCheck
        run: |
          pnpm -r eslint .
          pnpm -r tsc --noEmit
          pnpm -r build
