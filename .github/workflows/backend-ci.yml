name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies with retry
        run: |
          echo "🔁 Installing dependencies with retry logic..."
          n=0
          until [ $n -ge 3 ]
          do
            pnpm install && break
            n=$((n+1))
            echo "Retrying ($n/3) after failure..."
            sleep 5
          done

      - name: Run tests
        run: pnpm test

      - name: Build backend
        run: pnpm build
