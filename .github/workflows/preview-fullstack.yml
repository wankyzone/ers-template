name: Fullstack Preview Environment (Supabase + Vercel)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'packages/backend/**'
      - 'packages/web/**'
      - '.github/workflows/preview-fullstack.yml'

jobs:
  backend-preview:
    if: github.event.action != 'closed'
    name: Deploy Supabase Preview
    runs-on: ubuntu-latest
    outputs:
      preview_ref: ${{ steps.create-preview.outputs.preview_ref }}
      preview_db_url: ${{ steps.create-preview.outputs.preview_db_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Supabase Preview Project
        id: create-preview
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          PREVIEW_ID=$(supabase projects create "preview-${{ github.event.pull_request.number }}" \
            --org-id ${{ secrets.SUPABASE_ORG_ID }} \
            --region eu-west-1 \
            --db-password "Temp123!" | jq -r '.ref')
          PREVIEW_DB_URL=$(supabase projects list | jq -r ".[] | select(.ref==\"$PREVIEW_ID\") | .db.url")
          echo "preview_ref=$PREVIEW_ID" >> $GITHUB_OUTPUT
          echo "preview_db_url=$PREVIEW_DB_URL" >> $GITHUB_OUTPUT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Schema to Preview
        run: supabase db push --project-ref ${{ steps.create-preview.outputs.preview_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Functions to Preview
        run: supabase functions deploy backend --project-ref ${{ steps.create-preview.outputs.preview_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  frontend-preview:
    needs: backend-preview
    if: github.event.action != 'closed'
    name: Deploy Vercel Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Deploy to Vercel (Preview)
        id: deploy-vercel
        run: |
          cd packages/web
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add NEXT_PUBLIC_SUPABASE_URL "${{ needs.backend-preview.outputs.preview_db_url }}" --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY "${{ secrets.SUPABASE_ANON_KEY }}" --token=${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --yes --scope=${{ secrets.VERCEL_TEAM_ID }})
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🧩 **Fullstack Preview Environment Deployed!**
            - Supabase Project: `${{ needs.backend-preview.outputs.preview_ref }}`
            - Frontend Preview: [Open in Vercel](${{ steps.deploy-vercel.outputs.preview_url }})

  cleanup:
    if: github.event.action == 'closed'
    name: Cleanup Preview Environments
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Destroy Supabase Preview
        run: |
          PREVIEW_ID="preview-${{ github.event.pull_request.number }}"
          echo "🧹 Cleaning up Supabase Preview: $PREVIEW_ID"
          supabase projects delete $PREVIEW_ID --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Remove Vercel Preview
        run: |
          echo "🧹 Removing Vercel Preview Deployment"
          vercel remove ers-client --safe --yes --token=${{ secrets.VERCEL_TOKEN }}
